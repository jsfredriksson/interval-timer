<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Intervals">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#e8402a">
<title>Interval Timer</title>
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%23e8402a'/%3E%3Crect x='44' y='20' width='12' height='60' fill='%23fff'/%3E%3Crect x='20' y='44' width='60' height='12' fill='%23fff'/%3E%3C/svg%3E">
<style>
  :root{
    color-scheme: dark;
    --red:#e8402a;
    --black:#0a0a0a;
    --paper:#f2f0ea;
    --white:#ffffff;
    --line: rgba(255,255,255,.28);
    --lineDark: rgba(0,0,0,.22);
    --muted: rgba(255,255,255,.55);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none;}
  html,body{
    height:100%; margin:0; background:var(--black); color:var(--white);
    font-family:"Helvetica Neue", Helvetica, Arial, sans-serif;
    overscroll-behavior:none;
  }
  input{ font-family:inherit; }
  body{
    display:flex; flex-direction:column; height:100dvh;
    padding:env(safe-area-inset-top,16px) 0 env(safe-area-inset-bottom,10px);
    transition:background-color .3s ease;
    position:relative; overflow:hidden;
  }
  body.phase-prep,
  body.phase-rest,
  body.phase-roundReset{ background:var(--black); }
  body.phase-work{ background:var(--red); }
  body.phase-done{ background:var(--red); }

  /* ---- Full-screen continuous progress fill ---- */
  .progress-fill{
    position:fixed; left:0; right:0; bottom:0; z-index:1; height:0%;
    background:rgba(255,255,255,.14); pointer-events:none;
  }
  body.phase-done .progress-fill{ display:none; }

  /* Opaque "plate" so key readouts stay legible no matter what the fill is doing behind them */
  .plate{ display:inline-block; align-self:flex-start; padding:2px 8px; margin:0 -8px; }
  body.phase-prep .plate, body.phase-rest .plate, body.phase-roundReset .plate{ background:var(--black); }
  body.phase-work .plate{ background:var(--red); }

  /* ---- Top bar ---- */
  .top{
    position:relative; z-index:2; width:100%; display:flex; align-items:center; justify-content:space-between;
    padding:4px 24px 16px; border-bottom:1px solid var(--line);
  }
  .phase-work .top, .phase-done .top{ border-bottom-color:var(--lineDark); }
  .brand{display:flex; align-items:center; gap:12px;}
  .brand .mark{width:22px; height:22px; position:relative; flex:none;}
  .brand .mark::before, .brand .mark::after{
    content:''; position:absolute; background:var(--white); inset:0;
  }
  .phase-work .brand .mark::before, .phase-work .brand .mark::after,
  .phase-done .brand .mark::before, .phase-done .brand .mark::after{ background:var(--black); }
  .brand .mark::before{ top:41%; height:18%; }
  .brand .mark::after{ left:41%; width:18%; }
  .brand .word{font-size:14px; font-weight:700; letter-spacing:.16em; text-transform:uppercase;}
  .icon-btn-plain{background:none; border:none; color:var(--white); padding:8px; margin:-8px; border-radius:12px; cursor:pointer;}
  .icon-btn-plain:active{ background:rgba(255,255,255,.15); }
  .phase-work .icon-btn-plain, .phase-done .icon-btn-plain{ color:var(--black); }
  .phase-work .icon-btn-plain:active, .phase-done .icon-btn-plain:active{ background:rgba(0,0,0,.1); }
  .icon-btn-plain svg{ display:block; }
  .wake-dot{width:7px; height:7px; background:var(--red); border-radius:50%; margin-right:6px; visibility:hidden;}

  /* ---- Center stage ---- */
  .center{
    position:relative; z-index:2; flex:1; display:flex; flex-direction:column; justify-content:center;
    padding:0 24px; min-height:0;
  }
  .tag-row{display:flex; align-items:center; gap:8px; margin-bottom:12px;}
  .tag{width:12px; height:12px; background:var(--white); flex:none;}
  .phase-prep .tag{ background:var(--white); }
  .phase-work .tag{ background:var(--black); }
  .phase-rest .tag{ background:var(--red); }
  .phase-roundReset .tag{ background:var(--red); box-shadow:3px 3px 0 var(--white); }
  .phase-done .tag{ background:var(--white); }
  .phase-label{
    font-size:14px; font-weight:700; letter-spacing:.22em; text-transform:uppercase; color:var(--white);
  }
  .phase-work .phase-label, .phase-done .phase-label{ color:var(--black); }

  .time{
    font-size:clamp(96px, 32vw, 220px); font-weight:800; font-variant-numeric:tabular-nums;
    letter-spacing:-.04em; line-height:.9; margin:4px 0 8px; color:var(--white);
  }
  .phase-work .time, .phase-done .time{ color:var(--black); }

  .next{
    font-size:14px; font-weight:600; letter-spacing:.04em; color:var(--muted); text-transform:uppercase;
  }
  .phase-work .next, .phase-done .next{ color:rgba(0,0,0,.55); }

  .cross{
    width:min(34vw,140px); height:min(34vw,140px); position:relative; margin:6px 0 14px;
  }
  .cross::before, .cross::after{ content:''; position:absolute; background:var(--white); }
  .cross::before{ left:38%; right:38%; top:0; bottom:0; }
  .cross::after{ top:38%; bottom:38%; left:0; right:0; }

  .meta-row{
    position:relative; z-index:2; display:flex; justify-content:space-between; align-items:baseline;
    padding:0 24px 16px; font-size:12px; font-weight:700; letter-spacing:.08em; text-transform:uppercase;
    color:var(--muted); font-variant-numeric:tabular-nums;
  }
  .phase-work .meta-row, .phase-done .meta-row{ color:rgba(0,0,0,.55); }

  /* ---- Controls ---- */
  .controls{
    position:relative; z-index:2; width:100%; display:flex; gap:12px; padding:0 24px;
  }
  .btn{
    flex:1; padding:20px 0; border:none; font-size:15px; font-weight:700; letter-spacing:.14em; text-transform:uppercase;
    cursor:pointer; -webkit-appearance:none; appearance:none; border-radius:18px;
  }
  .btn:active{ opacity:.75; }
  .btn.primary{ background:var(--white); color:var(--black); }
  .phase-work .btn.primary, .phase-done .btn.primary{ background:var(--black); color:var(--white); }
  .btn.secondary{
    background:transparent; color:var(--white); border:2px solid var(--line);
  }
  .phase-work .btn.secondary, .phase-done .btn.secondary{ color:var(--black); border-color:var(--lineDark); }

  /* ---- Settings sheet ---- */
  .sheet-backdrop{
    position:fixed; inset:0; background:rgba(0,0,0,.6); display:none; align-items:flex-end; z-index:20;
  }
  .sheet-backdrop.open{display:flex;}
  .sheet{
    width:100%; background:var(--black); color:var(--white); padding:20px 20px calc(env(safe-area-inset-bottom,18px) + 18px);
    max-height:86dvh; overflow-y:auto; border-top:4px solid var(--red);
  }
  .sheet h2{
    margin:2px 0 16px; font-size:20px; font-weight:800; text-transform:uppercase; letter-spacing:.02em; color:var(--white);
  }
  .sheet h3{
    margin:22px 0 10px; font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.16em;
    color:var(--red); border-bottom:2px solid var(--white); padding-bottom:6px;
  }
  .field{display:flex; align-items:center; justify-content:space-between; padding:12px 0; border-bottom:1px solid rgba(255,255,255,.15);}
  .field label{font-size:14px; font-weight:700; text-transform:uppercase; letter-spacing:.03em; color:var(--white);}
  .field .sub{display:block; font-size:11px; font-weight:400; text-transform:none; letter-spacing:0; color:rgba(255,255,255,.5); margin-top:2px;}
  .stepper{display:flex; align-items:center; gap:6px;}
  .stepper button{
    width:36px; height:36px; border:none; background:var(--white); color:var(--black); border-radius:50%;
    font-size:18px; font-weight:700; line-height:1; cursor:pointer;
  }
  .stepper button:active{ background:var(--red); color:var(--white); }
  .stepper span{min-width:56px; text-align:center; font-variant-numeric:tabular-nums; font-size:14px; font-weight:700; color:var(--white); background:transparent; border:2px solid var(--white); border-radius:10px;}

  .exercise-row{display:flex; align-items:center; gap:10px; padding:8px 0;}
  .exercise-row .idx{width:20px; text-align:center; color:var(--red); font-size:13px; font-weight:800;}
  .exercise-row input{
    flex:1; background:var(--black); border:2px solid var(--white); border-radius:12px; padding:10px 14px;
    color:var(--white); font-size:14px; font-weight:600;
  }
  .exercise-row input::placeholder{ color:rgba(255,255,255,.4); }

  .sheet-actions{display:flex; gap:10px; margin-top:18px;}
  .sheet-actions .btn{padding:15px 0; border-radius:18px;}
  .sheet-actions .btn.secondary{ background:var(--black); border:2px solid var(--white); color:var(--white); }
  .sheet-actions .btn.primary{ background:var(--white); color:var(--black); }
  .sheet-actions .btn.ghost{ background:transparent; border:2px solid var(--white); color:var(--white); }

  .toggle-row{display:flex; align-items:center; justify-content:space-between; padding:12px 0;}
  .toggle-row label{font-size:14px; font-weight:700; text-transform:uppercase; letter-spacing:.03em; color:var(--white);}
  .switch{position:relative; width:48px; height:26px; background:var(--black); border:2px solid var(--white); border-radius:999px; cursor:pointer;}
  .switch.on{background:var(--red);}
  .switch::after{content:''; position:absolute; top:2px; left:2px; width:18px; height:18px; background:var(--white); border-radius:50%; transition:transform .15s;}
  .switch.on::after{transform:translateX(20px); background:var(--black);}

  .workout-item{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    background:var(--black); border:2px solid var(--white); border-radius:16px; padding:12px 14px; margin-bottom:10px;
  }
  .workout-item .info{flex:1; min-width:0;}
  .workout-item .info .name{font-size:14px; font-weight:800; text-transform:uppercase; color:var(--white);}
  .workout-item .info .meta{font-size:11px; color:rgba(255,255,255,.55); margin-top:2px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .workout-item .actions{display:flex; gap:8px;}
  .icon-btn{
    background:var(--white); border:none; color:var(--black); font-weight:700; text-transform:uppercase; border-radius:10px;
    padding:8px 12px; font-size:11px; letter-spacing:.05em; cursor:pointer;
  }
  .icon-btn.danger{ background:var(--red); color:var(--white); }
  .empty-state{color:rgba(255,255,255,.5); font-size:13px; text-align:center; padding:24px 0; text-transform:uppercase; letter-spacing:.05em;}
</style>
</head>
<body class="phase-prep">

  <audio id="sndCountdown" src="sounds/countdown.mp3" preload="auto"></audio>
  <audio id="sndWorkStart" src="sounds/work-start.mp3" preload="auto"></audio>
  <audio id="sndHalfway" src="sounds/halfway.mp3" preload="auto"></audio>
  <audio id="sndRestStart" src="sounds/rest-start.mp3" preload="auto"></audio>
  <audio id="sndRoundReset" src="sounds/round-reset.mp3" preload="auto"></audio>
  <audio id="sndComplete" src="sounds/complete.mp3" preload="auto"></audio>

  <div class="progress-fill" id="progressFill"></div>

  <div class="top">
    <div class="brand">
      <span class="wake-dot" id="wakeIndicator" title="Screen wake lock"></span>
      <span class="mark"></span>
      <span class="word">Interval</span>
    </div>
    <div class="next" id="roundsLabel" style="font-size:13px;">Round 1 / 8</div>
    <button class="icon-btn-plain" id="openSettings" aria-label="Settings">
      <svg width="24" height="16" viewBox="0 0 20 14"><rect width="20" height="2" fill="currentColor"/><rect y="6" width="20" height="2" fill="currentColor"/><rect y="12" width="20" height="2" fill="currentColor"/></svg>
    </button>
  </div>

  <div class="center">
    <div class="tag-row">
      <span class="tag"></span>
      <div class="phase-label plate" id="phaseLabel">Get Ready</div>
    </div>
    <div class="time plate" id="timeDisplay">00:10</div>
    <div class="cross" id="doneCross" style="display:none;"></div>
    <div class="next" id="nextLabel">then Work</div>
  </div>

  <div class="meta-row">
    <span id="metaLeft">Round 1/8</span>
    <span id="metaRight">Ex 1/1</span>
  </div>

  <div class="controls">
    <button class="btn secondary" id="resetBtn">Reset</button>
    <button class="btn primary" id="startBtn">Start</button>
  </div>

  <!-- Settings Sheet -->
  <div class="sheet-backdrop" id="sheetBackdrop">
    <div class="sheet">
      <h2>Workout Settings</h2>

      <div class="sheet-actions" style="margin-top:0; margin-bottom:6px;">
        <button class="btn secondary" id="loadWorkoutBtn">Load Previous</button>
        <button class="btn primary" id="saveWorkoutBtn">Save Workout</button>
      </div>

      <h3>Timing</h3>
      <div class="field">
        <label>Prepare</label>
        <div class="stepper">
          <button data-target="prep" data-step="-5">−</button>
          <span id="prepVal">10s</span>
          <button data-target="prep" data-step="5">+</button>
        </div>
      </div>
      <div class="field">
        <label>Work</label>
        <div class="stepper">
          <button data-target="work" data-step="-5">−</button>
          <span id="workVal">20s</span>
          <button data-target="work" data-step="5">+</button>
        </div>
      </div>
      <div class="field">
        <label>Rest<span class="sub">between exercises</span></label>
        <div class="stepper">
          <button data-target="rest" data-step="-5">−</button>
          <span id="restVal">10s</span>
          <button data-target="rest" data-step="5">+</button>
        </div>
      </div>
      <div class="field">
        <label>Rounds</label>
        <div class="stepper">
          <button data-target="rounds" data-step="-1">−</button>
          <span id="roundsVal">8</span>
          <button data-target="rounds" data-step="1">+</button>
        </div>
      </div>
      <div class="field">
        <label>Round Reset<span class="sub">time until new round starts</span></label>
        <div class="stepper">
          <button data-target="roundReset" data-step="-5">−</button>
          <span id="roundResetVal">30s</span>
          <button data-target="roundReset" data-step="5">+</button>
        </div>
      </div>

      <h3>Exercises</h3>
      <div class="field">
        <label>Number of Exercises</label>
        <div class="stepper">
          <button data-target="exerciseCount" data-step="-1">−</button>
          <span id="exerciseCountVal">1</span>
          <button data-target="exerciseCount" data-step="1">+</button>
        </div>
      </div>
      <div id="exerciseList"></div>

      <h3>Alerts</h3>
      <div class="toggle-row">
        <label>Sound</label>
        <div class="switch on" id="soundToggle"></div>
      </div>
      <div class="toggle-row">
        <label>Vibration</label>
        <div class="switch on" id="vibrateToggle"></div>
      </div>

      <div class="sheet-actions">
        <button class="btn ghost" id="closeSettings">Close</button>
      </div>
    </div>
  </div>

  <!-- Load Workout Sheet -->
  <div class="sheet-backdrop" id="loadBackdrop">
    <div class="sheet">
      <h2>Load Previous Workout</h2>
      <div id="workoutList"></div>
      <div class="sheet-actions">
        <button class="btn ghost" id="closeLoad">Close</button>
      </div>
    </div>
  </div>

<script>
(function(){
  "use strict";

  const $ = id => document.getElementById(id);

  // ---- State ----
  const state = {
    prep: 10, work: 20, rest: 10, roundReset: 30, rounds: 8,
    exerciseCount: 1, exercises: ["Exercise 1"],
    sound: true, vibrate: true,
  };

  try {
    const saved = JSON.parse(localStorage.getItem('intervalTimerSettings') || 'null');
    if (saved) Object.assign(state, saved);
  } catch(e){}
  normalizeExercises();

  function normalizeExercises(){
    state.exerciseCount = Math.max(1, state.exerciseCount || 1);
    const list = Array.isArray(state.exercises) ? state.exercises.slice() : [];
    while (list.length < state.exerciseCount) list.push('Exercise ' + (list.length + 1));
    list.length = state.exerciseCount;
    state.exercises = list;
  }

  function persist(){
    localStorage.setItem('intervalTimerSettings', JSON.stringify(state));
  }

  function getWorkouts(){
    try{ return JSON.parse(localStorage.getItem('intervalTimerWorkouts') || '[]'); }
    catch(e){ return []; }
  }
  function saveWorkouts(list){
    localStorage.setItem('intervalTimerWorkouts', JSON.stringify(list));
  }

  // ---- Timer engine ----
  let phase = 'idle'; // idle | prep | work | rest | roundReset | done
  let round = 1;
  let exerciseIndex = 0;
  let remaining = 0;
  let running = false;
  let tickHandle = null;
  let endTime = 0;
  let wakeLock = null;

  const body = document.body;
  const timeDisplay = $('timeDisplay');
  const phaseLabel = $('phaseLabel');
  const nextLabel = $('nextLabel');
  const roundsLabel = $('roundsLabel');
  const metaLeft = $('metaLeft');
  const metaRight = $('metaRight');
  const doneCross = $('doneCross');
  const progressFill = $('progressFill');
  const startBtn = $('startBtn');

  function exName(i){
    return (state.exercises && state.exercises[i]) ? state.exercises[i] : ('Exercise ' + (i+1));
  }

  function fmt(s){
    s = Math.max(0, Math.ceil(s));
    const m = Math.floor(s/60);
    const sec = s % 60;
    return (m>0 ? m+':'+String(sec).padStart(2,'0') : '0:'+String(sec).padStart(2,'0'));
  }

  function setPhaseUI(p){
    body.className = 'phase-' + p;
  }

  function currentPhaseDuration(p){
    if (p==='prep') return state.prep;
    if (p==='work') return state.work;
    if (p==='rest') return state.rest;
    if (p==='roundReset') return state.roundReset;
    return 0;
  }

  function labelFor(p){
    if (p==='prep') return 'Get Ready';
    if (p==='work') return exName(exerciseIndex);
    if (p==='rest') return 'Rest';
    if (p==='roundReset') return 'Round Reset';
    if (p==='done') return 'Complete';
    return '';
  }

  function nextLabelFor(p){
    const lastExercise = exerciseIndex >= state.exerciseCount - 1;
    if (p==='prep') return 'Then ' + exName(0);
    if (p==='work'){
      if (!lastExercise) return state.rest>0 ? 'Then Rest' : 'Then ' + exName(exerciseIndex+1);
      if (round < state.rounds) return state.roundReset>0 ? 'Then Round Reset' : 'Then ' + exName(0);
      return '';
    }
    if (p==='rest') return 'Then ' + exName(exerciseIndex+1);
    if (p==='roundReset') return 'Then ' + exName(0);
    if (p==='done') return state.rounds + ' rounds finished';
    return '';
  }

  function updateDisplay(){
    const isDone = phase === 'done';
    timeDisplay.style.display = isDone ? 'none' : '';
    doneCross.style.display = isDone ? 'block' : 'none';

    timeDisplay.textContent = fmt(remaining);
    phaseLabel.textContent = labelFor(phase);
    nextLabel.textContent = nextLabelFor(phase);

    if (isDone){
      roundsLabel.textContent = 'Complete';
      metaLeft.textContent = `${state.rounds} Rounds`;
      metaRight.textContent = `${state.exerciseCount} Exercises`;
    } else if (phase==='prep'){
      roundsLabel.textContent = `Round 1 / ${state.rounds}`;
      metaLeft.textContent = `Round 1/${state.rounds}`;
      metaRight.textContent = `Ex 1/${state.exerciseCount}`;
    } else {
      roundsLabel.textContent = `Round ${round} / ${state.rounds}`;
      metaLeft.textContent = `Round ${round}/${state.rounds}`;
      metaRight.textContent = `Ex ${exerciseIndex+1}/${state.exerciseCount}`;
    }

    updateProgressFill();
  }

  function updateProgressFill(){
    const total = currentPhaseDuration(phase) || 1;
    const elapsedFrac = (phase==='done') ? 1 : Math.min(1, Math.max(0, 1 - (remaining / total)));
    progressFill.style.height = (elapsedFrac * 100) + '%';
  }

  // ---- Custom sound clips (replace the old synthesized beeps) ----
  const sounds = {
    countdown: $('sndCountdown'),
    workStart: $('sndWorkStart'),
    halfway: $('sndHalfway'),
    restStart: $('sndRestStart'),
    roundReset: $('sndRoundReset'),
    complete: $('sndComplete'),
  };
  let audioUnlocked = false;

  // iOS/Safari only allow audio playback once it's been "unlocked" by a real
  // user tap. We play+immediately pause every clip inside the first Start tap.
  function unlockAudio(){
    if (audioUnlocked) return;
    audioUnlocked = true;
    Object.values(sounds).forEach(el=>{
      if (!el) return;
      const prevMuted = el.muted;
      el.muted = true;
      el.play().then(()=>{ el.pause(); el.currentTime = 0; el.muted = prevMuted; }).catch(()=>{ el.muted = prevMuted; });
    });
  }

  function playSound(key){
    if (!state.sound) return;
    const el = sounds[key];
    if (!el) return;
    try{
      el.currentTime = 0;
      el.play().catch(()=>{});
    }catch(e){}
  }

  function vibrate(pattern){
    if (state.vibrate && navigator.vibrate) navigator.vibrate(pattern);
  }

  function announcePhaseStart(p){
    if (p==='work'){ playSound('workStart'); vibrate([80,60,80]); }
    else if (p==='rest'){ playSound('restStart'); vibrate(60); }
    else if (p==='roundReset'){ playSound('roundReset'); vibrate([100,80,100]); }
    else if (p==='done'){ playSound('complete'); vibrate([100,60,100,60,200]); }
  }

  function countdownTick(){ playSound('countdown'); }

  function halfwayChime(){ playSound('halfway'); }

  async function requestWakeLock(){
    try{
      if ('wakeLock' in navigator){
        wakeLock = await navigator.wakeLock.request('screen');
        $('wakeIndicator').style.visibility = 'visible';
        wakeLock.addEventListener('release', ()=>{ $('wakeIndicator').style.visibility='hidden'; });
      }
    }catch(e){}
  }
  function releaseWakeLock(){
    if (wakeLock){ wakeLock.release().catch(()=>{}); wakeLock=null; }
  }
  document.addEventListener('visibilitychange', ()=>{
    if (document.visibilityState==='visible' && running) requestWakeLock();
  });

  let lastWholeSecond = null;
  let halfwayPlayed = false;

  function tick(){
    const now = Date.now();
    remaining = (endTime - now) / 1000;
    const whole = Math.ceil(remaining);

    if (phase === 'work' && !halfwayPlayed && remaining <= state.work / 2){
      halfwayPlayed = true;
      halfwayChime();
    }

    updateProgressFill();

    if (whole !== lastWholeSecond){
      lastWholeSecond = whole;
      if (whole > 0 && whole <= 3 && phase !== 'idle' && phase !== 'done') {
        countdownTick();
      }
      updateDisplay();
    }

    if (remaining <= 0){
      advancePhase();
      return;
    }
    tickHandle = requestAnimationFrame(tick);
  }

  function startPhase(p, dur){
    phase = p;
    remaining = dur;
    endTime = Date.now() + dur*1000;
    lastWholeSecond = null;
    halfwayPlayed = false;
    setPhaseUI(p);
    announcePhaseStart(p);
    updateDisplay();
    if (dur <= 0){ advancePhase(); return; }
    tickHandle = requestAnimationFrame(tick);
  }

  function advancePhase(){
    cancelAnimationFrame(tickHandle);
    if (phase === 'prep'){
      round = 1; exerciseIndex = 0;
      startPhase('work', state.work);
    } else if (phase === 'work'){
      const lastExercise = exerciseIndex >= state.exerciseCount - 1;
      if (!lastExercise){
        startPhase('rest', state.rest);
      } else if (round < state.rounds){
        startPhase('roundReset', state.roundReset);
      } else {
        finish();
      }
    } else if (phase === 'rest'){
      exerciseIndex++;
      startPhase('work', state.work);
    } else if (phase === 'roundReset'){
      round++; exerciseIndex = 0;
      startPhase('work', state.work);
    }
  }

  function finish(){
    phase = 'done';
    setPhaseUI('done');
    announcePhaseStart('done');
    remaining = 0;
    updateDisplay();
    running = false;
    startBtn.textContent = 'Start';
    releaseWakeLock();
  }

  function start(){
    if (running) return;
    running = true;
    startBtn.textContent = 'Pause';
    requestWakeLock();
    if (phase === 'idle' || phase === 'done'){
      round = 1; exerciseIndex = 0;
      startPhase('prep', state.prep);
    } else {
      // resume from pause
      endTime = Date.now() + remaining*1000;
      lastWholeSecond = null;
      tickHandle = requestAnimationFrame(tick);
    }
  }

  function pause(){
    running = false;
    startBtn.textContent = 'Resume';
    cancelAnimationFrame(tickHandle);
  }

  function reset(){
    running = false;
    cancelAnimationFrame(tickHandle);
    phase = 'idle';
    round = 1;
    exerciseIndex = 0;
    remaining = state.prep;
    setPhaseUI('prep');
    startBtn.textContent = 'Start';
    updateDisplay();
    releaseWakeLock();
  }

  startBtn.addEventListener('click', ()=>{
    unlockAudio();
    if (running) pause(); else start();
  });
  $('resetBtn').addEventListener('click', reset);

  // ---- Settings sheet ----
  const sheetBackdrop = $('sheetBackdrop');
  const exerciseListEl = $('exerciseList');

  function renderExerciseInputs(){
    exerciseListEl.innerHTML = '';
    for (let i=0; i<state.exerciseCount; i++){
      const row = document.createElement('div');
      row.className = 'exercise-row';
      const idx = document.createElement('div');
      idx.className = 'idx';
      idx.textContent = (i+1) + '.';
      const input = document.createElement('input');
      input.type = 'text';
      input.value = exName(i);
      input.placeholder = 'Exercise ' + (i+1);
      input.addEventListener('input', ()=>{
        state.exercises[i] = input.value;
      });
      row.appendChild(idx);
      row.appendChild(input);
      exerciseListEl.appendChild(row);
    }
  }

  function syncSettingsUI(){
    $('prepVal').textContent = state.prep + 's';
    $('workVal').textContent = state.work + 's';
    $('restVal').textContent = state.rest + 's';
    $('roundsVal').textContent = state.rounds;
    $('roundResetVal').textContent = state.roundReset + 's';
    $('exerciseCountVal').textContent = state.exerciseCount;
    $('soundToggle').classList.toggle('on', state.sound);
    $('vibrateToggle').classList.toggle('on', state.vibrate);
    renderExerciseInputs();
  }

  $('openSettings').addEventListener('click', ()=>{
    syncSettingsUI();
    sheetBackdrop.classList.add('open');
  });
  $('closeSettings').addEventListener('click', ()=>{
    normalizeExercises();
    sheetBackdrop.classList.remove('open');
    persist();
    if (!running) reset();
  });
  sheetBackdrop.addEventListener('click', (e)=>{
    if (e.target === sheetBackdrop){
      normalizeExercises();
      sheetBackdrop.classList.remove('open'); persist(); if(!running) reset();
    }
  });

  document.querySelectorAll('.stepper button').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const target = btn.dataset.target;
      const step = parseInt(btn.dataset.step, 10);
      let min = (target==='rounds' || target==='exerciseCount') ? 1 : 0;
      state[target] = Math.max(min, (state[target]||0) + step);
      if (target === 'exerciseCount') normalizeExercises();
      syncSettingsUI();
    });
  });

  $('soundToggle').addEventListener('click', ()=>{
    state.sound = !state.sound;
    syncSettingsUI();
  });
  $('vibrateToggle').addEventListener('click', ()=>{
    state.vibrate = !state.vibrate;
    syncSettingsUI();
  });

  // ---- Save / Load workouts ----
  const loadBackdrop = $('loadBackdrop');
  const workoutListEl = $('workoutList');

  $('saveWorkoutBtn').addEventListener('click', ()=>{
    normalizeExercises();
    const name = window.prompt('Name this workout:', '');
    if (!name) return;
    const workouts = getWorkouts();
    const entry = {
      name: name.trim(),
      savedAt: Date.now(),
      prep: state.prep, work: state.work, rest: state.rest,
      roundReset: state.roundReset, rounds: state.rounds,
      exerciseCount: state.exerciseCount, exercises: state.exercises.slice(),
    };
    const existingIdx = workouts.findIndex(w => w.name === entry.name);
    if (existingIdx >= 0) workouts[existingIdx] = entry; else workouts.unshift(entry);
    saveWorkouts(workouts);
  });

  function renderWorkoutList(){
    const workouts = getWorkouts();
    workoutListEl.innerHTML = '';
    if (!workouts.length){
      const empty = document.createElement('div');
      empty.className = 'empty-state';
      empty.textContent = 'No saved workouts yet.';
      workoutListEl.appendChild(empty);
      return;
    }
    workouts.forEach((w, i)=>{
      const item = document.createElement('div');
      item.className = 'workout-item';
      const info = document.createElement('div');
      info.className = 'info';
      const nameEl = document.createElement('div');
      nameEl.className = 'name';
      nameEl.textContent = w.name;
      const metaEl = document.createElement('div');
      metaEl.className = 'meta';
      metaEl.textContent = `${w.exerciseCount} exercises · ${w.rounds} rounds · ${w.work}s work / ${w.rest}s rest`;
      info.appendChild(nameEl);
      info.appendChild(metaEl);

      const actions = document.createElement('div');
      actions.className = 'actions';
      const loadBtn = document.createElement('button');
      loadBtn.className = 'icon-btn';
      loadBtn.textContent = 'Load';
      loadBtn.addEventListener('click', ()=>{
        Object.assign(state, {
          prep: w.prep, work: w.work, rest: w.rest, roundReset: w.roundReset,
          rounds: w.rounds, exerciseCount: w.exerciseCount, exercises: w.exercises.slice(),
        });
        normalizeExercises();
        persist();
        syncSettingsUI();
        loadBackdrop.classList.remove('open');
        if (!running) reset();
      });
      const delBtn = document.createElement('button');
      delBtn.className = 'icon-btn danger';
      delBtn.textContent = '✕';
      delBtn.addEventListener('click', ()=>{
        const list = getWorkouts();
        list.splice(i, 1);
        saveWorkouts(list);
        renderWorkoutList();
      });
      actions.appendChild(loadBtn);
      actions.appendChild(delBtn);

      item.appendChild(info);
      item.appendChild(actions);
      workoutListEl.appendChild(item);
    });
  }

  $('loadWorkoutBtn').addEventListener('click', ()=>{
    renderWorkoutList();
    loadBackdrop.classList.add('open');
  });
  $('closeLoad').addEventListener('click', ()=>{
    loadBackdrop.classList.remove('open');
  });
  loadBackdrop.addEventListener('click', (e)=>{
    if (e.target === loadBackdrop) loadBackdrop.classList.remove('open');
  });

  // Init
  remaining = state.prep;
  setPhaseUI('prep');
  updateDisplay();
})();
</script>
</body>
</html>
